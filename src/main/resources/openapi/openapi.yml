        title:
          type: string
          minLength: 3
          maxLength: 100
          description: Название события
          example: "Митап по Java"
        description:
          type: string
          maxLength: 255
          description: Краткое описание события
          example: "Встреча для обсуждения новых технологий Java."
        eventDate:
          type: string
