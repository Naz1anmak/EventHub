spring:
  application:
    name: event-hub

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_schema: event_hub

  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: event_hub

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379