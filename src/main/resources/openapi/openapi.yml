        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/v1/api/{eventId}/tags/{tagId}:
    get:
      tags:
        - tag
      summary: Получить тег по id
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: tagId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
