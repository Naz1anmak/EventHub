components:
  schemas:
    # ----- Requests -----
    UserCreateDto:
      type: object
      required: [ username, email, metadata ]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: Имя пользователя
          example: "ivan.petrov"
        email:
          type: string
          format: email
          description: Email пользователя
          example: "ivan.petrov@example.com"
        metadata:
          $ref: '#/components/schemas/UserMetadataCreateDto'

    UserUpdateDto:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: Новое имя пользователя
          example: "petr.ivanov"
        email:
          type: string
          format: email
          description: Новый email пользователя
          example: "petr.ivanov@example.com"
        metadata:
          $ref: '#/components/schemas/UserMetadataUpdateDto'

    UserMetadataCreateDto:
      type: object
      required: [ firstName, lastName, phone ]
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 30
          description: Имя
          example: "Иван"
        lastName:
          type: string
          minLength: 2
          maxLength: 30
          description: Фамилия
          example: "Петров"
        address:
          type: string
          description: Адрес
          example: "г. Москва, ул. Тверская, д. 1"
        phone:
          type: string
          maxLength: 16
          description: Телефон
          example: "+7-999-123-45-67"

    UserMetadataUpdateDto:
      type: object
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 30
          description: Новое имя
          example: "Пётр"
        lastName:
          type: string
          minLength: 2
          maxLength: 30
          description: Новая фамилия
          example: "Иванов"
        address:
          type: string
          description: Новый адрес
          example: "г. Санкт-Петербург, Невский пр., д. 10"
        phone:
          type: string
          maxLength: 16
          description: Новый телефон
          example: "+7-888-654-32-10"

    CategoryCreateDto:
      type: object
      required: [ name, projects ]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Название категории
          example: "Технологии"
        description:
          type: string
          maxLength: 255
          description: Описание категории
          example: "Категория для технологических событий."
        projects:
          type: array
          description: Список проектов в категории
          items:
            $ref: '#/components/schemas/ProjectCreateDto'

    CategoryUpdateDto:
      type: object
      required: [ projects ]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Новое название категории
          example: "Образование"
        description:
          type: string
          maxLength: 255
          description: Новое описание категории
          example: "Категория для образовательных мероприятий."
        projects:
          type: array
          description: Список проектов
          items:
            $ref: '#/components/schemas/ProjectCreateDto'

    ProjectCreateDto:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Название проекта
          example: "EventHub"
        description:
          type: string
          maxLength: 255
          description: Описание проекта
          example: "Платформа для организации событий."

    ProjectUpdateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
