components:
  schemas:
    # ----- Requests -----
    EventCreateDto:
      type: object
      required: [ title, tags ]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          description: Название события
          example: "Митап по Java"
        description:
          type: string
          maxLength: 255
          description: Краткое описание события
          example: "Встреча для обсуждения новых технологий Java."
        eventDate:
          type: string
          format: date-time
          description: Дата и время проведения
          example: "2025-12-10T18:00:00+03:00"
        location:
          type: string
          description: Место проведения
          example: "Москва, ул. Ленина, 10"
        tags:
          type: array
          description: Список дто тегов
          items:
            $ref: '#/components/schemas/TagCreateDto'

    EventUpdateDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          description: Новое название события
          example: "Spring Boot Workshop"
        description:
          type: string
          maxLength: 255
          description: Новое описание события
          example: "Практический семинар по Spring Boot."
        eventDate:
          type: string
          format: date-time
          description: Новая дата и время проведения
          example: "2025-12-15T19:00:00+03:00"
        location:
          type: string
          description: Новое место проведения
          example: "Санкт-Петербург, пр. Невский, 100"
        tags:
          type: array
          description: Новый список идентификаторов тегов
          items:
            type: string
            format: uuid
            example: "c1d2e3f4-5678-1234-abcd-9876543210ab"
        updateMode:
          type: string
          enum: [ REPLACE, ADD ]
          description: Режим обновления тегов
          example: "ADD"

    CategoryCreateDto:
      type: object
      required: [ name, projects ]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Название категории
          example: "Технологии"
        description:
          type: string
          maxLength: 255
          description: Описание категории
          example: "Категория для технологических событий."
        projects:
          type: array
          description: Список проектов в категории
          items:
            $ref: '#/components/schemas/ProjectCreateDto'

    CategoryUpdateDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Новое название категории
          example: "Образование"
        description:
          type: string
          maxLength: 255
          description: Новое описание категории
          example: "Категория для образовательных мероприятий."
        projects:
          type: array
          description: Cписок идентификаторов проектов
          items:
            $ref: '#/components/schemas/ProjectCreateDto'
        updateMode:
          type: string
          enum: [ REPLACE, ADD ]
          description: Режим добавления проектов в категорию
          example: "ADD"

    TagCreateDto:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Название тега
          example: "Java"
        description:
          type: string
          maxLength: 255
          description: Описание тега
          example: "Тег для событий, связанных с Java."

    TagUpdateDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          description: Новое название тега
          example: "Spring"
        description:
          type: string
          maxLength: 255
          description: Новое описание тега
          example: "Тег для событий по Spring Framework."

    UserCreateDto:
      type: object
      required: [ username, metadata ]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: Имя пользователя
          example: "ivan.petrov"
        email:
          type: string
