spring:
  application:
    name: event-hub

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: event_hub

  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: event_hub

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      tag-analytics:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      tag-analytics:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        ignoreExceptions:
          - ru.practicum.eventhub.infrastructure.feign.exception.TagAnalyticsClientException
          - ru.practicum.eventhub.infrastructure.feign.exception.TagNotFoundException

services:
  tag-analytics:
    url: http://localhost:8081
